<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#E9EDF0" />
    <title>내버스시간표 · 오프라인</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #e9edf0;
        color: #000;
      }
      main {
        width: min(28rem, calc(100% - 2rem));
        padding: 1.5rem;
        border: 1px solid #c5cad0;
        border-radius: 1.25rem;
        background: #fff;
      }
      p {
        color: #000;
        line-height: 1.6;
      }
      a {
        color: #000;
      }
    </style>
  </head>
  <body>
    <main>
      <p>연결 없음</p>
      <h1>지금은 오프라인입니다</h1>
      <p>
        요청한 페이지가 캐시에 없습니다. 네트워크가 돌아오면 앱으로
        돌아갈 수 있습니다.
      </p>
      <p><a href="./">앱으로 돌아가기</a></p>
    </main>
  </body>
</html>
